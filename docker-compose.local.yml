version: "3.8"
services:
  mysql:
    container_name: learn-go-mysql
    image: bitnami/mysql:8.0
    restart: unless-stopped
    volumes:
      - db_data:/bitnami/mysql/data
    environment:
      - MYSQL_USER=mysql
      - MYSQL_PASSWORD=mysql
      - MYSQL_ROOT_PASSWORD=mysql
      - MYSQL_DATABASE=learn-go
    ports:
      - "3306:3306"
volumes:
  db_data:
